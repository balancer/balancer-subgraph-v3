name: Deploy v3 Vault Subgraphs
on:
  push:
    branches: main
    paths:
      - "subgraphs/v3-vault/**"
  workflow_dispatch:

jobs:
  deploy-mainnet:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: mainnet
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-gnosis:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: gnosis
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-sepolia:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: sepolia
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-arbitrum:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: arbitrum-one
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-base:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: base
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-sonic:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: sonic
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-avalanche:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: avalanche
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-optimism:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: optimism
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-xlayer:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: xlayer
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-plasma:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: plasma
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-hyperevm:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: hyperevm
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}

  deploy-monad:
    uses: ./.github/workflows/deploy-ormi.yml
    with:
      subgraph: vault
      network: monad
    secrets:
      DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}